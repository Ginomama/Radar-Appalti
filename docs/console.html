<title>Radar Appalti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style id="css">
:root{
  --ground:#F6F7F5; --surface:#FFFFFF; --surface-2:#EFF2EE;
  --ink:#131816; --ink-2:#5A6461; --ink-3:#8A938F;
  --rule:#DCE2DD; --rule-forte:#C3CCC5;
  --accento:#1E6E58; --accento-tenue:#E4EFEA;
  --alta:#A8342A; --alta-bg:#F7E7E4;
  --media:#A9741A; --media-bg:#F9EFDF;
  --bassa:#3E6E63; --bassa-bg:#E6EFEB;
  --ombra:0 1px 2px rgba(19,24,22,.05), 0 4px 14px rgba(19,24,22,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1211; --surface:#161B19; --surface-2:#1D2422;
    --ink:#E9EEEB; --ink-2:#98A29E; --ink-3:#6D7773;
    --rule:#252D2A; --rule-forte:#374039;
    --accento:#57AE90; --accento-tenue:#172A24;
    --alta:#E2796C; --alta-bg:#2C1C1A;
    --media:#D5A254; --media-bg:#2B2419;
    --bassa:#6FAE9D; --bassa-bg:#182421;
    --ombra:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1211; --surface:#161B19; --surface-2:#1D2422;
  --ink:#E9EEEB; --ink-2:#98A29E; --ink-3:#6D7773;
  --rule:#252D2A; --rule-forte:#374039;
  --accento:#57AE90; --accento-tenue:#172A24;
  --alta:#E2796C; --alta-bg:#2C1C1A;
  --media:#D5A254; --media-bg:#2B2419;
  --bassa:#6FAE9D; --bassa-bg:#182421;
  --ombra:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:15px; line-height:1.5;
}
.wrap{max-width:1180px; margin:0 auto; padding:28px 22px 72px}
h1,h2,h3{font-family:Archivo,"IBM Plex Sans",system-ui,sans-serif; text-wrap:balance; margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* intestazione */
header{display:flex; flex-wrap:wrap; align-items:flex-end; gap:16px 24px; margin-bottom:26px}
h1{font-size:27px; font-weight:700; letter-spacing:-.02em}
.sotto{color:var(--ink-2); font-size:13.5px; margin-top:3px}
.spia{margin-left:auto; display:flex; align-items:center; gap:8px; font-size:12px;
  color:var(--ink-2); font-family:"IBM Plex Mono",monospace}
.pallino{width:7px; height:7px; border-radius:50%; background:var(--accento)}

/* tessere di riepilogo */
.tessere{display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:12px; margin-bottom:30px}
.tess{background:var(--surface); border:1px solid var(--rule); border-radius:5px;
  padding:13px 15px 14px; box-shadow:var(--ombra)}
.tess .et{font-size:10.5px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600}
.tess .v{font-family:Archivo,sans-serif; font-size:25px; font-weight:600;
  letter-spacing:-.02em; margin-top:5px; font-variant-numeric:tabular-nums}
.tess .n{font-size:12px; color:var(--ink-2); margin-top:1px}

/* pannelli */
.griglia{display:grid; grid-template-columns:1.55fr 1fr; gap:20px; align-items:start}
@media (max-width:900px){ .griglia{grid-template-columns:1fr} }
/* Senza questo una colonna della griglia non scende sotto la larghezza minima
   del suo contenuto — e la tabella delle scadenze ha sette colonne. Risultato:
   la pagina diventava 1112px dentro una finestra da 700 e si scorreva in
   orizzontale invece di far scorrere la sola tabella. */
.griglia > *{min-width:0}
.pan{background:var(--surface); border:1px solid var(--rule); border-radius:5px;
  box-shadow:var(--ombra); overflow:hidden; margin-bottom:20px; min-width:0}
.pan > h2{font-size:14px; font-weight:600; letter-spacing:-.01em;
  padding:13px 16px; border-bottom:1px solid var(--rule); display:flex;
  align-items:center; gap:10px}
.pan > h2 .conta{margin-left:auto; font-size:11.5px; color:var(--ink-3);
  font-family:"IBM Plex Mono",monospace; font-weight:400}
.corpo{padding:6px 0}

/* tracker PEC */
.lotto-t{font-size:10.5px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600; padding:12px 16px 6px}
.riga{display:flex; align-items:center; gap:11px; padding:8px 16px;
  border-bottom:1px solid var(--rule)}
.riga:last-child{border-bottom:none}
.riga:hover{background:var(--surface-2)}
.riga .idx{font-family:"IBM Plex Mono",monospace; font-size:11.5px;
  color:var(--ink-3); width:20px; flex:none; text-align:right}
.riga .chi{flex:1; min-width:0}
.riga .nome{font-size:13.5px; font-weight:500; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis}
.riga .meta{font-size:11.5px; color:var(--ink-2); font-family:"IBM Plex Mono",monospace;
  margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
/* Lo stato NON deve somigliare a un bottone. Prima .p-da aveva bordo e sfondo
   identici a .btn, e ogni riga mostrava quattro forme uguali in fila: una era
   un'informazione, tre erano azioni, e non si capiva quale fosse cliccabile.
   Ora lo stato e' un pallino colorato piu' testo, senza bordo ne' sfondo, in
   una colonna di larghezza fissa: cosi' i bottoni si allineano fra le righe e
   l'occhio scorre una colonna sola. */
/* Larghezza fissa tarata su "nessuna risposta", l'etichetta piu' lunga: piu'
   di cosi' e ogni nome di ente viene tagliato per niente. */
.pillola{font-size:11.5px; font-weight:500; white-space:nowrap; flex:none;
  display:inline-flex; align-items:center; gap:6px; width:112px}
.pillola::before{content:""; width:8px; height:8px; border-radius:50%;
  flex:none; background:currentColor}
.p-da{color:var(--ink-3)}
.p-inv{color:var(--media)}
.p-ris{color:var(--bassa); font-weight:600}
.p-no{color:var(--ink-3)}
.p-err{color:var(--alta); font-weight:600}
.azioni{display:flex; gap:5px; flex:none}
button{font:inherit; cursor:pointer}
.btn{font-size:11.5px; font-weight:500; padding:4px 10px; border-radius:3px;
  border:1px solid var(--rule-forte); background:var(--surface); color:var(--ink-2);
  transition:background .12s, border-color .12s, color .12s}
.btn:hover{background:var(--accento-tenue); border-color:var(--accento); color:var(--accento)}
.btn:focus-visible{outline:2px solid var(--accento); outline-offset:2px}
/* Un'azione non applicabile si nasconde invece di restare grigia: tre bottoni
   di cui due inerti su ogni riga sono rumore, e l'opacita' al 40% non basta a
   distinguerli. Lo spazio resta occupato per non far ballare le colonne. */
.btn[disabled]{visibility:hidden}
.azioni .posto{display:inline-block}

/* il bottone che spedisce si distingue dagli altri: e' l'unico irreversibile */
.btn-pec{border-color:var(--accento); color:var(--accento);
  background:var(--accento-tenue); font-weight:600}
.btn-pec:hover{background:var(--accento); color:var(--surface)}

/* finestra di conferma invio */
.velo{position:fixed; inset:0; background:rgba(19,24,22,.55); z-index:50;
  display:flex; align-items:center; justify-content:center; padding:20px}
.modale{background:var(--surface); border:1px solid var(--rule-forte);
  border-radius:6px; box-shadow:0 12px 40px rgba(0,0,0,.28); width:min(720px,100%);
  max-height:88vh; display:flex; flex-direction:column}
.modale h3{font-size:15px; padding:14px 18px; border-bottom:1px solid var(--rule)}
.modale .campi{padding:12px 18px; border-bottom:1px solid var(--rule);
  font-size:12.5px; line-height:1.7}
.modale .campi b{display:inline-block; min-width:78px; color:var(--ink-2);
  font-weight:500}
.modale .campi .val{font-family:"IBM Plex Mono",monospace; color:var(--ink)}
.modale pre{margin:0; padding:14px 18px; overflow:auto; flex:1;
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; line-height:1.55;
  white-space:pre-wrap; word-break:break-word; color:var(--ink)}
.modale .piede{padding:12px 18px; border-top:1px solid var(--rule);
  display:flex; gap:9px; align-items:center}
.modale .piede .btn{font-size:12.5px; padding:7px 14px}
.blocco{margin:0 18px 12px; padding:11px 13px; border-radius:4px;
  background:var(--alta-bg); color:var(--alta); font-size:12.5px; line-height:1.55}
.blocco ul{margin:6px 0 0; padding-left:18px}
.avvertenza{font-size:11.5px; color:var(--ink-2); line-height:1.5; flex:1}

/* riga di spiegazione sotto ogni titolo di pannello: chi apre la pagina per
   la prima volta deve capire cosa sta guardando senza chiedere a nessuno */
.aiuto{font-size:12px; color:var(--ink-2); line-height:1.5;
  padding:10px 16px 11px; border-bottom:1px solid var(--rule);
  background:var(--surface-2)}
.aiuto b{color:var(--ink); font-weight:600}

/* Da fare: la prima cosa della pagina. La colonna dei numeri grandi e' il
   segno della console: la si scorre e si sa quanto lavoro c'e' oggi. */
.oggi{background:var(--surface); border:1px solid var(--rule);
  border-left:3px solid var(--accento); border-radius:5px; box-shadow:var(--ombra);
  padding:16px 18px 6px; margin-bottom:24px}
.oggi h2{font-size:19px; font-weight:700; letter-spacing:-.015em}
.oggi .finora{font-size:12.5px; color:var(--ink-2); margin-top:3px}
.oggi .finora b{color:var(--ink); font-weight:600}
.compiti{list-style:none; margin:12px 0 0; padding:0}
.compito{display:flex; gap:16px; align-items:baseline; padding:11px 0;
  border-top:1px solid var(--rule)}
.compito .q{font-family:Archivo,sans-serif; font-size:28px; font-weight:700;
  letter-spacing:-.03em; line-height:1; min-width:46px; text-align:right;
  font-variant-numeric:tabular-nums; flex:none}
.compito .t{font-size:14px; line-height:1.45}
.compito .t b{font-weight:600}
.compito .det{font-size:12.5px; color:var(--ink-2); margin-top:3px; line-height:1.45}
.compito.t-alta .q{color:var(--accento)}
.compito.t-err .q{color:var(--alta)}
.compito.t-quiet .q{color:var(--ink-3)}
.oggi .niente{font-size:13.5px; color:var(--ink-2); margin:12px 0 10px}
code{font-family:"IBM Plex Mono",monospace; font-size:.92em; background:var(--surface-2);
  padding:1px 4px; border-radius:3px}

/* un riquadro per lotto, chiuso finche' non serve */
details.lotto{border-top:1px solid var(--rule)}
.pan > .aiuto + details.lotto{border-top:none}
details.lotto > summary{list-style:none; cursor:pointer; display:flex; flex-wrap:wrap;
  align-items:baseline; gap:3px 14px; padding:13px 16px}
details.lotto > summary::-webkit-details-marker{display:none}
details.lotto > summary::before{content:"\203A"; color:var(--ink-3); width:10px;
  display:inline-block; transition:transform .15s; font-size:16px; line-height:1}
details.lotto[open] > summary::before{transform:rotate(90deg)}
details.lotto > summary:hover{background:var(--surface-2)}
details.lotto > summary:focus-visible{outline:2px solid var(--accento); outline-offset:-2px}
.l-nome{font-family:Archivo,sans-serif; font-weight:600; font-size:14.5px}
.l-conti{font-size:12.5px; color:var(--ink-2)}
.l-conti b{color:var(--ink); font-weight:600}
.l-dx{margin-left:auto; font-size:11.5px; color:var(--ink-3);
  font-family:"IBM Plex Mono",monospace}
details.lotto .dentro{padding-bottom:6px; border-top:1px solid var(--rule)}
details.lotto .funnel{margin:12px 16px 8px}
/* Otto stadi in fila quando c'e' posto, due file da quattro quando no: con il
   flex-wrap di prima "vendite" finiva da solo su una riga. */
details.lotto .dentro{container-type:inline-size}
details.lotto .passi{display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); gap:10px 8px}
details.lotto .passo{min-width:0}
details.lotto .passo .e, details.lotto .passo .p{white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis}
details.lotto .freccia{display:none}
@container (max-width:620px){
  details.lotto .passi{grid-template-columns:repeat(4,minmax(0,1fr))}
}
/* il passo successivo: in evidenza, ma non come l'invio PEC, che non si ritira */
.btn-avanti{color:var(--ink); font-weight:600}
h2.sez{font-size:13px; font-weight:600; color:var(--ink-2); letter-spacing:.02em;
  margin:6px 0 12px}

/* legenda dei colori: senza, i numeri rossi e arancioni non vogliono dire nulla */
.legenda{display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center;
  padding:9px 16px; border-bottom:1px solid var(--rule); font-size:11.5px;
  color:var(--ink-2)}
.legenda .v{display:inline-flex; align-items:center; gap:6px}
.legenda .v::before{content:""; width:9px; height:9px; border-radius:2px;
  background:currentColor}
.legenda .l-alta{color:var(--alta)} .legenda .l-media{color:var(--media)}
.legenda .l-bassa{color:var(--ink-3)}

/* intestazioni ordinabili */
thead th.ord{cursor:pointer; user-select:none; white-space:nowrap}
thead th.ord:hover{color:var(--accento)}
thead th.ord::after{content:"\2195"; opacity:.3; margin-left:5px; font-size:11px}
thead th.ord[data-dir="asc"]::after{content:"\2191"; opacity:1}
thead th.ord[data-dir="desc"]::after{content:"\2193"; opacity:1}
thead th.ord:focus-visible{outline:2px solid var(--accento); outline-offset:-2px}

/* data di scadenza sotto i giorni */
td.gg .quando{display:block; font-size:10.5px; color:var(--ink-3);
  font-weight:400; margin-top:1px}

/* spia di freschezza: diventa ambra e poi rossa quando i dati invecchiano */
.spia.vecchia .pallino{background:var(--media)}
.spia.scaduta .pallino{background:var(--alta)}
.spia.scaduta{color:var(--alta)}

@media (max-width:760px){
  .wrap{padding:20px 14px 56px}
  /* Tessere piu' larghe: sotto i 760px il minimo da 158px ne stipava quattro
     per riga lasciandone una spaiata sotto. */
  .tessere{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  /* Nome su tutta la prima riga, stato e azioni sempre sulla seconda: se va
     a capo solo chi ha il nome lungo, ogni riga ha una forma diversa e
     l'occhio non trova piu' la colonna dei bottoni. */
  .riga{flex-wrap:wrap; gap:6px 10px}
  .riga .idx{order:0}
  .riga .chi{flex:1 1 calc(100% - 30px); order:1; min-width:0}
  .pillola{order:2; width:auto; flex:0 0 auto; margin-left:30px}
  .azioni{order:3; margin-left:auto}
  .compito{gap:12px}
  .compito .q{min-width:34px; font-size:23px}
  .l-dx{margin-left:0}
}

/* esito del lotto */
.verdetto{margin:2px 16px 14px; padding:11px 13px; border-radius:4px;
  background:var(--surface-2); font-size:12.5px; color:var(--ink-2); line-height:1.5}
.verdetto b{color:var(--ink); font-weight:600}

/* barre categoria */
.cat{padding:7px 16px}
.cat-r{display:flex; align-items:baseline; gap:8px; font-size:12.5px; margin-bottom:3px}
.cat-r .n{margin-left:auto; font-family:"IBM Plex Mono",monospace; color:var(--ink-2); font-size:11.5px}
.barra{height:5px; background:var(--surface-2); border-radius:3px; overflow:hidden}
.barra i{display:block; height:100%; background:var(--accento); border-radius:3px}

/* tabella scadenze */
.filtri{display:flex; flex-wrap:wrap; gap:8px; padding:12px 16px; border-bottom:1px solid var(--rule)}
select,input[type=search]{font:inherit; font-size:12.5px; padding:5px 9px;
  border:1px solid var(--rule-forte); border-radius:3px; background:var(--surface);
  color:var(--ink); min-width:0}
input[type=search]{flex:1; min-width:150px}
select:focus-visible,input:focus-visible{outline:2px solid var(--accento); outline-offset:1px}
.tab-scroll{overflow-x:auto; max-height:560px; overflow-y:auto}
table{border-collapse:collapse; width:100%; font-size:12.5px}
thead th{position:sticky; top:0; background:var(--surface); z-index:1;
  text-align:left; font-size:10.5px; letter-spacing:.07em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600; padding:9px 12px; border-bottom:1px solid var(--rule-forte);
  white-space:nowrap}
tbody td{padding:8px 12px; border-bottom:1px solid var(--rule); vertical-align:top}
tbody tr:hover{background:var(--surface-2)}
td.gg{font-family:"IBM Plex Mono",monospace; font-weight:500; white-space:nowrap;
  font-variant-numeric:tabular-nums}
td.imp{font-family:"IBM Plex Mono",monospace; text-align:right; white-space:nowrap;
  font-variant-numeric:tabular-nums}
td.ente{max-width:250px}
td.ogg{max-width:300px; color:var(--ink-2); font-size:11.5px}
.g-alta{color:var(--alta)} .g-media{color:var(--media)} .g-bassa{color:var(--ink-2)}
.tag{display:inline-block; font-size:10.5px; padding:1.5px 6px; border-radius:3px;
  background:var(--surface-2); color:var(--ink-2); white-space:nowrap}
a{color:var(--accento); text-decoration:none}
a:hover{text-decoration:underline}
.vuoto{padding:26px 16px; color:var(--ink-3); font-size:13px; text-align:center}

footer{margin-top:30px; padding-top:16px; border-top:1px solid var(--rule);
  font-size:11.5px; color:var(--ink-3); line-height:1.6}
.avviso{background:var(--media-bg); color:var(--media); border-radius:4px;
  padding:10px 13px; font-size:12.5px; margin:0 0 18px}
@media (prefers-reduced-motion:reduce){ *{transition:none !important} }

    /* R18 — il punteggio del lead */
    td.pt{text-align:center;width:52px}
    .pallino{display:inline-block;min-width:30px;padding:2px 6px;border-radius:11px;
             font-weight:700;font-size:12px;font-variant-numeric:tabular-nums;
             cursor:help}
    .p-alto  {background:#0f766e;color:#fff}
    .p-buono {background:#14b8a6;color:#04302c}
    .p-medio {background:#cbd5e1;color:#0f172a}
    .p-basso {background:#f1f5f9;color:#64748b}
    .p-vuoto {background:transparent;color:#94a3b8;cursor:default}
    @media (prefers-color-scheme:dark){
      .p-medio{background:#334155;color:#e2e8f0}
      .p-basso{background:#1e293b;color:#94a3b8}
    }
  
    /* R19 — scheda ente */
    .link-ente{background:none;border:none;padding:0;font:inherit;text-align:left;
               color:var(--ink);cursor:pointer;border-bottom:1px dotted var(--rule-forte)}
    .link-ente:hover{color:var(--accento);border-bottom-color:var(--accento)}
    .link-ente:focus-visible{outline:2px solid var(--accento);outline-offset:2px}
    .scheda{padding:0 18px 16px;overflow:auto;flex:1}
    .scheda h4{font-family:Archivo,sans-serif;font-size:11px;letter-spacing:.09em;
               text-transform:uppercase;color:var(--ink-3);margin:18px 0 8px;
               font-weight:600}
    .scheda .capo{padding:14px 0 4px;font-size:12.5px;color:var(--ink-2);line-height:1.6}
    .verdetto-ente{padding:11px 13px;border-radius:4px;font-size:13px;line-height:1.5;
                   background:var(--surface-2)}
    .verdetto-ente.sn{background:var(--bassa-bg);color:var(--bassa)}
    .verdetto-ente.no{background:var(--alta-bg);color:var(--alta)}
    .scheda table{font-size:12px;width:100%}
    .scheda td{padding:5px 8px;vertical-align:top}
    .anno{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:3px}
    .anno .a{width:38px;color:var(--ink-2);font-family:"IBM Plex Mono",monospace}
    .anno .v{width:78px;text-align:right;font-family:"IBM Plex Mono",monospace}
    .anno .b{flex:1;height:7px;background:var(--surface-2);border-radius:3px}
    .anno .b i{display:block;height:100%;background:var(--accento);border-radius:3px}
  
    /* R25 — funnel */
    .funnel{margin:10px 0 14px;padding:12px 14px;background:var(--surface-2);
            border-radius:5px}
    .passi{display:flex;align-items:flex-end;gap:2px;flex-wrap:wrap}
    .passo{flex:1;min-width:74px}
    .passo .q{display:block;font-family:Archivo,sans-serif;font-size:19px;
              font-weight:600;line-height:1.1}
    .passo .e{display:block;font-size:11px;color:var(--ink-2);margin-top:1px}
    .passo .p{display:block;font-size:10px;color:var(--ink-3);min-height:13px}
    .passo .b{display:block;height:5px;background:var(--surface);
              border-radius:3px;margin-top:4px;overflow:hidden}

      !dataDi(i, "sollecitata") && -giorni(dataDi(i, "inviata")) >= GIORNI_SOLLECITO;
  }

  function oggi(){ var d=new Date(); d.setHours(0,0,0,0); return d; }
  function giorni(iso){
    if(!iso) return null;
    var d = new Date(iso+"T00:00:00");
    return Math.round((d - oggi())/86400000);
  }
  function eur(v){
    if(v==null) return "n.d.";
    return "€ " + Math.round(v).toLocaleString("it-IT");
  }
  // eur() senza il simbolo: prima ogni chiamante faceva .replace("€ ","")
  function num(v){ return v==null ? "n.d." : Math.round(v).toLocaleString("it-IT"); }

  var MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio",
              "agosto","settembre","ottobre","novembre","dicembre"];
  function dataIt(iso){
    if(!iso) return "";
    var d = new Date(String(iso).slice(0,10)+"T00:00:00");
    if(isNaN(d)) return "";
    return d.getDate()+" "+MESI[d.getMonth()].slice(0,3)+" "+d.getFullYear();
  }
  function dataOraIt(iso){
    if(!iso) return "";
    var d = new Date(String(iso).replace(" ","T"));
    if(isNaN(d)) return String(iso).slice(0,16);
    var p = function(n){ return (n<10?"0":"")+n; };
    return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear()+
           " alle "+p(d.getHours())+":"+p(d.getMinutes());
  }
  // Somma quanti destinatari stanno in ciascuno stato.
  function conteggi(righe){
    var c = {};
    righe.forEach(function(i){ var s = statoDi(i); c[s] = (c[s]||0)+1; });
    return c;
  }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }
  function chiave(i){ return i.lotto + "#" + i.n; }
  function statoDi(i){
    var s = STATO.invii[chiave(i)];
    return s ? s.stato : i.stato;
  }
  function dataDi(i, campo){
    var s = STATO.invii[chiave(i)];
    return (s && s[campo]) || i[campo];
  }

  // Cumulativi: chi ha una call fissata ha anche risposto. Contare solo chi e'
  // fermo su "ha risposto" dava "0 risposte" accanto a un funnel che ne
  // mostrava una: due numeri diversi per la stessa cosa, sulla stessa pagina.
  var DOPO_RISPOSTA = {risposta:1, discovery_fissata:1, discovery_fatta:1,
                       offerta:1, vendita:1};
  function partita(i){ return statoDi(i) !== "da_inviare"; }
  function rispose(i){ return !!(DOPO_RISPOSTA[statoDi(i)] || dataDi(i, "risposta")); }

  // IndicePA scrive la provincia in sigla, ANAC per esteso: nella stessa lista
  // comparivano "PU" e "PESARO E URBINO". Si mostra sempre il nome.
  var SIGLE = {};
  ("AG:Agrigento|AL:Alessandria|AN:Ancona|AO:Aosta|AP:Ascoli Piceno|AQ:L'Aquila|"+
   "AR:Arezzo|AT:Asti|AV:Avellino|BA:Bari|BG:Bergamo|BI:Biella|BL:Belluno|"+
   "BN:Benevento|BO:Bologna|BR:Brindisi|BS:Brescia|BT:Barletta-Andria-Trani|"+
   "BZ:Bolzano|CA:Cagliari|CB:Campobasso|CE:Caserta|CH:Chieti|CL:Caltanissetta|"+
   "CN:Cuneo|CO:Como|CR:Cremona|CS:Cosenza|CT:Catania|CZ:Catanzaro|EN:Enna|"+
   "FC:Forl\u00ec-Cesena|FE:Ferrara|FG:Foggia|FI:Firenze|FM:Fermo|FR:Frosinone|"+
   "GE:Genova|GO:Gorizia|GR:Grosseto|IM:Imperia|IS:Isernia|KR:Crotone|LC:Lecco|"+
   "LE:Lecce|LI:Livorno|LO:Lodi|LT:Latina|LU:Lucca|MB:Monza e Brianza|MC:Macerata|"+
   "ME:Messina|MI:Milano|MN:Mantova|MO:Modena|MS:Massa-Carrara|MT:Matera|NA:Napoli|"+
   "NO:Novara|NU:Nuoro|OR:Oristano|PA:Palermo|PC:Piacenza|PD:Padova|PE:Pescara|"+
   "PG:Perugia|PI:Pisa|PN:Pordenone|PO:Prato|PR:Parma|PT:Pistoia|PU:Pesaro e Urbino|"+
   "PV:Pavia|PZ:Potenza|RA:Ravenna|RC:Reggio Calabria|RE:Reggio Emilia|RG:Ragusa|"+
   "RI:Rieti|RM:Roma|RN:Rimini|RO:Rovigo|SA:Salerno|SI:Siena|SO:Sondrio|SP:La Spezia|"+
   "SR:Siracusa|SS:Sassari|SU:Sud Sardegna|SV:Savona|TA:Taranto|TE:Teramo|TN:Trento|"+
   "TO:Torino|TP:Trapani|TR:Terni|TS:Trieste|TV:Treviso|UD:Udine|VA:Varese|"+
   "VB:Verbano-Cusio-Ossola|VC:Vercelli|VE:Venezia|VI:Vicenza|VR:Verona|VT:Viterbo|"+
   "VV:Vibo Valentia").split("|").forEach(function(x){
    var p = x.split(":"); SIGLE[p[0]] = p[1].toUpperCase();
  });
  function provNome(p){ return (p && SIGLE[p]) || p || ""; }

  // Accorcia a fine parola: "integrazione con" a meta' frase sembra un errore.
  function taglia(s, n){
    s = String(s || "");
    if(s.length <= n) return s;
    var t = s.slice(0, n), sp = t.lastIndexOf(" ");
    return (sp > n * 0.6 ? t.slice(0, sp) : t).replace(/[\s.,:;]+$/, "") + "…";
  }

  // I nomi ANAC arrivano tutti maiuscoli: dentro una frase si leggono male.
  var MINUSCOLE = {di:1, del:1, della:1, dello:1, delle:1, dei:1, degli:1, per:1,
                   e:1, il:1, la:1, lo:1, le:1, a:1, al:1, alla:1, allo:1, ai:1,
                   agli:1, in:1};
  function titolo(s){
    s = String(s || "");
    if(s !== s.toUpperCase()) return s;
    return s.toLowerCase().split(" ").map(function(w, k){
      return (k && MINUSCOLE[w]) ? w : w.charAt(0).toUpperCase() + w.slice(1);
    }).join(" ");
  }

  /* ---------------------------------------------------------- riepilogo */
  function tessere(){
    var t = DATI.totali;
    // Tutte le percentuali sul totale delle scadenze future (t.scadenze), e la
    // base scritta sotto. Prima la prima tessera contava i 12 mesi e le due
    // accanto una base diversa: due numeri affiancati che non tornavano.
    var mld = t.valore365 / 1e9;
    var v = [
      ["contratti in scadenza", num(t.a365),
       "nei prossimi 12 mesi · " + num(t.a90) + " entro 90 giorni"],
      ["valore complessivo",
       "€ " + mld.toLocaleString("it-IT", {maximumFractionDigits:2}) + " mld",
       "somma degli importi di aggiudicazione"],
      ["raggiungibili via PEC", Math.round(t.con_pec / t.scadenze * 100) + "%",
       num(t.con_pec) + " su " + num(t.scadenze) + " scadenze totali"],
      ["con categoria assegnata",
       Math.round(t.con_categoria / t.scadenze * 100) + "%",
       "classificate dal codice CPV, non a mano"],
      ["enti censiti", num(t.enti),
       num(t.competitor) + " fornitori già mappati"]
    ];
    return '<div class="tessere">' + v.map(function(x){
      return '<div class="tess"><div class="et">'+esc(x[0])+'</div>'+
             '<div class="v">'+esc(x[1])+'</div><div class="n">'+esc(x[2])+'</div></div>';
    }).join("") + '</div>';
  }

  /* ------------------------------------------------------ lotti e invii */
  // Nomi per chi legge, non per chi ha scritto lo script: "pec-marche-generico"
  // non dice a nessuno che e' il test senza contratto.
  var NOMI_LOTTI = {
    "pec": "Nazionale",
    "pec-marche": "Marche \u00b7 primo lotto",
    "pec-marche-comuni": "Marche \u00b7 comuni con contratto in scadenza",
    "pec-marche-generico": "Marche \u00b7 test senza contratto",
    "pec-sbt": "San Benedetto del Tronto"
  };
  function nomeLotto(l){
    if(NOMI_LOTTI[l]) return NOMI_LOTTI[l];
    var s = String(l).replace(/^pec-?/, "").replace(/-/g, " ");
    return s ? s.charAt(0).toUpperCase() + s.slice(1) : "Lotto";
  }
  function perLotto(){
    var g = {};
    DATI.invii.forEach(function(i){ (g[i.lotto] = g[i.lotto] || []).push(i); });
    return g;
  }
  function nomiEnti(righe, max){
    var n = righe.map(function(i){ return titolo(i.ente || "?"); });
    return n.length > max ? n.slice(0, max).join(", ") + " e altri " + (n.length - max)
                          : n.join(", ");
  }
  function ultimoInvio(righe){
    return righe.reduce(function(m, i){
      var d = dataDi(i, "inviata") || ""; return d > m ? d : m;
    }, "");
  }

  /* ------------------------------------------------------------ da fare */
  // In cima perche' e' la domanda con cui si apre la pagina: cosa faccio
  // adesso. Un compito per riga, dal piu' prezioso; i numeri del mercato
  // stanno in fondo, servono una volta e non ogni mattina.
  function daFare(){
    var tutte = DATI.invii;
    function con(st){ return tutte.filter(function(i){ return statoDi(i) === st; }); }
    function eta(i){ var d = dataDi(i, "inviata"); return d ? -giorni(d) : 0; }
    var voci = [];

    var call = con("discovery_fissata");
    if(call.length) voci.push(["t-alta", call.length,
      '<b>' + (call.length === 1 ? 'call fissata' : 'call fissate') + '</b>' +
      (LOCALE ? ' \u2014 preparala: la scheda dell\u2019ente dice come compra e chi lo serve oggi.' : ''),
      nomiEnti(call, 4) + (call.length === 1 && call[0].note
        ? ' \u00b7 ' + taglia(call[0].note, 170) : '')]);

    var fatte = con("discovery_fatta");
    if(fatte.length) voci.push(["t-alta", fatte.length,
      '<b>' + (fatte.length === 1 ? 'call fatta' : 'call fatte') + ', offerta da mandare</b>',
      nomiEnti(fatte, 4)]);

    var off = con("offerta");
    if(off.length) voci.push(["", off.length,
      '<b>' + (off.length === 1 ? 'offerta in attesa di risposta' : 'offerte in attesa di risposta') + '</b>',
      nomiEnti(off, 4)]);

    var ris = con("risposta");
    if(ris.length) voci.push(["t-alta", ris.length,
      '<b>' + (ris.length === 1 ? 'ha risposto' : 'hanno risposto') + '</b> \u2014 ' +
      'ricontatta per fissare una call: \u00e8 la cosa che vale di pi\u00f9.',
      nomiEnti(ris, 4)]);

    var ko = tutte.filter(function(i){
      var st = statoDi(i); return st === "non_consegnata" || (st === "inviata" && i.errore);
    });
    if(ko.length) voci.push(["t-err", ko.length,
      '<b>' + (ko.length === 1 ? 'PEC non arrivata' : 'PEC non arrivate') + '</b> \u2014 ' +
      'casella piena o indirizzo dismesso: verifica il recapito prima di riprovare.',
      nomiEnti(ko, 4)]);

    var soll = con("inviata").filter(function(i){
      return i.consegnata && !i.sollecitata && eta(i) >= 12 && eta(i) <= GIORNI_ATTESA;
    });
    if(soll.length) voci.push(["", soll.length,
      '<b>da sollecitare</b> \u2014 consegnate da oltre 12 giorni, nessuna risposta.' +
      (LOCALE ? ' Apri il lotto: la riga ha il bottone <b>Sollecita</b>.' : ''),
      nomiEnti(soll, 4)]);

    var gruppi = perLotto(), pronte = [], nPronte = 0;
    Object.keys(gruppi).forEach(function(l){
      var q = gruppi[l].filter(function(i){ return statoDi(i) === "da_inviare"; }).length;
      if(q){ nPronte += q; pronte.push(q + " " + nomeLotto(l)); }
    });
    if(nPronte) voci.push(["", nPronte,
      '<b>' + (nPronte === 1 ? 'PEC pronta da inviare' : 'PEC pronte da inviare') + '</b>' +
      (LOCALE ? ' \u2014 apri il lotto e premi Invia PEC su ogni riga.' : ''),
      pronte.join(" \u00b7 ")]);

    var ferme = con("inviata").filter(function(i){ return eta(i) > GIORNI_ATTESA; });
    if(ferme.length) voci.push(["t-quiet", ferme.length,
      '<b>' + (ferme.length === 1 ? 'invio fermo' : 'invii fermi') + ' da oltre ' +
      GIORNI_ATTESA + ' giorni</b> \u2014 non risponderanno pi\u00f9: vanno chiusi' +
      (LOCALE ? ' con <code>invii.py --scadute</code>' : '') + '.', ""]);

    var partite = tutte.filter(partita).length;
    var risp = tutte.filter(rispose).length;
    var nCall = tutte.filter(function(i){ return dataDi(i, "discovery_fissata"); }).length;
    var vinte = tutte.filter(function(i){ return dataDi(i, "vendita"); }).length;
    var finora = partite
      ? 'Finora: <b>' + partite + '</b> PEC inviate \u00b7 <b>' + risp + '</b> ' +
        (risp === 1 ? 'risposta' : 'risposte') + ' \u00b7 <b>' + nCall + '</b> call' +
        (vinte ? ' \u00b7 <b>' + vinte + '</b> ' + (vinte === 1 ? 'vendita' : 'vendite') : '')
      : 'Nessuna PEC ancora inviata.';

    var corpo = voci.length
      ? '<ul class="compiti">' + voci.map(function(v){
          return '<li class="compito ' + v[0] + '"><span class="q">' + v[1] + '</span>' +
            '<div><div class="t">' + v[2] + '</div>' +
            (v[3] ? '<div class="det">' + esc(v[3]) + '</div>' : '') + '</div></li>';
        }).join("") + '</ul>'
      : '<p class="niente">Niente in sospeso.' + (LOCALE
          ? ' Il prossimo territorio lo dice <code>python ingestion/territorio.py --prossimo</code>.'
          : '') + '</p>';

    return '<section class="oggi" aria-labelledby="t-oggi"><h2 id="t-oggi">Da fare</h2>' +
      '<div class="finora">' + finora + '</div>' + corpo + '</section>';
  }

  // Un riquadro per lotto, chiuso: 63 righe aperte con quattro controlli
  // ciascuna facevano 8.000 pixel di pagina, e il lotto che serviva si perdeva.
  function lotti(){
    var gruppi = perLotto();
    // Prima i lotti con l'invio piu' recente: sono quelli su cui si lavora.
    var nomi = Object.keys(gruppi).sort(function(a, b){
      var ua = ultimoInvio(gruppi[a]), ub = ultimoInvio(gruppi[b]);
      if(ua !== ub) return ua < ub ? 1 : -1;
      return a < b ? -1 : 1;
    });
    var html = '<div class="pan"><h2>Invii PEC<span class="conta">' + nomi.length +
      ' lotti \u00b7 ' + DATI.invii.length + ' destinatari</span></h2>' +
      '<div class="aiuto">' + (LOCALE
        ? 'Apri un lotto per inviare le PEC o segnare cosa \u00e8 successo. Il bottone ' +
          'di ogni riga fa il passo successivo; gli altri sono in <b>Altro</b>.'
        : 'Lo stato di ogni PEC, lotto per lotto. \u00c8 una copia da consultare: ' +
          'si aggiorna ogni mattina.') + '</div>';

    nomi.forEach(function(lot){
      var righe = gruppi[lot];
      var q = conteggi(righe);
      var partite = righe.filter(partita).length;
      var risp = righe.filter(rispose).length;
      var nCall = righe.filter(function(i){ return dataDi(i, "discovery_fissata"); }).length;
      var pezzi = [];
      if(q.da_inviare) pezzi.push('<b>' + q.da_inviare + '</b> da inviare');
      if(partite){
        pezzi.push('<b>' + partite + '</b> inviate');
        pezzi.push('<b>' + risp + '</b> ' + (risp === 1 ? 'risposta' : 'risposte'));
      }
      if(nCall) pezzi.push('<b>' + nCall + '</b> call');
      html += '<details class="lotto" data-lotto="' + esc(lot) + '"' + (aperti[lot] ? ' open' : '') + '>' +
        '<summary><span class="l-nome">' + esc(nomeLotto(lot)) + '</span>' +
        '<span class="l-conti">' + pezzi.join(' \u00b7 ') + '</span>' +
        '<span class="l-dx">' + righe.length + ' destinatari</span></summary>' +
        '<div class="dentro">' + funnel(righe) + righe.map(rigaInvio).join("") + '</div></details>';
    });
    return html + '</div>';
  }

  function rigaInvio(i){
    var st = statoDi(i), inv = dataDi(i, "inviata"), coda = "";
    if(st === "inviata" && inv){
      var gg = -giorni(inv);
      coda = gg + (gg === 1 ? " giorno fa" : " giorni fa");
      // L'esito tecnico viene prima dell'attesa: una PEC mai consegnata
      // non e' "in attesa di risposta", e aspettarla e' tempo buttato.
      if(i.consegnata)        coda += " \u00b7 consegnata";
      else if(i.errore)       coda += " \u00b7 " + i.errore;
      else                    coda += " \u00b7 consegna non confermata";
      var sollIl = dataDi(i, "sollecitata");
      if(sollIl)              coda += " \u00b7 sollecitata il " + dataIt(sollIl);
      else if(gg > GIORNI_ATTESA) coda += " \u00b7 da chiudere";
    } else if(st !== "da_inviare" && dataDi(i, "risposta")){
      coda = "risposta il " + dataIt(dataDi(i, "risposta"));
    }
    var chi = i.ente || "?";
    var cosa = i.contratti
      ? i.contratti + (i.contratti === 1 ? " contratto" : " contratti")
      : "senza contratto";

    // La copia condivisa e' da consultare: niente controlli. Quello che si
    // segnasse li' verrebbe cancellato dall'aggiornamento del mattino dopo.
    // L'ente finisce in ogni aria-label: senza, da tastiera o con uno screen
    // reader si sentono decine di bottoni tutti uguali.
    var azioni = "";
    if(LOCALE){
      var dopo = PROSSIMO[st], prim = "";
      if(sollecitabile(i)){
        // Primario perche' e' il compito piu' utile su questa riga in
        // questo momento: la prima PEC e' consegnata, non ha risposto, e il
        // secondo contatto e' dove arriva la maggior parte delle risposte.
        // "Ha risposto" resta raggiungibile in Altro (dopo=null lo lascia
        // nella lista invece di escluderlo come bottone primario).
        prim = '<button class="btn btn-pec" data-pec="' + esc(chiave(i)) + '" data-sollecito="1"' +
          ' aria-label="Sollecita ' + esc(chi) + ', consegnata da oltre ' +
          GIORNI_SOLLECITO + ' giorni senza risposta">Sollecita</button>';
        dopo = null;
      } else if(st === "da_inviare" || st === "non_consegnata"){
        prim = '<button class="btn btn-pec" data-pec="' + esc(chiave(i)) + '"' +
          ' aria-label="Invia la PEC a ' + esc(chi) + '">' +
          (st === "da_inviare" ? "Invia PEC" : "Invia di nuovo") + '</button>';
        if(st === "non_consegnata") dopo = null;
      } else if(dopo){
        prim = '<button class="btn btn-avanti" data-az="' + dopo + '" data-k="' + esc(chiave(i)) + '"' +
          ' aria-label="' + esc(AZIONE[dopo]) + ': ' + esc(chi) + '">' + esc(AZIONE[dopo]) + '</button>';
      }
      var opz = TUTTE.filter(function(s){
        if(s === st || (s === dopo && st !== "da_inviare")) return false;
        if(st === "da_inviare") return s === "inviata";
        return s !== "inviata";
      });
      azioni = '<span class="azioni">' + prim + (opz.length
        ? '<select class="altro" data-k="' + esc(chiave(i)) + '"' +
          ' aria-label="Altre azioni per ' + esc(chi) + '">' +
          '<option value="">Altro\u2026</option>' + opz.map(function(s){
            return '<option value="' + s + '">' +
              esc(s === "inviata" ? "Segna inviata (spedita fuori da qui)" : AZIONE[s]) + '</option>';
          }).join("") + '</select>'
        : '') + '</span>';
    }
    return '<div class="riga"><span class="idx">' + i.n + '</span>' +
      '<span class="chi"><div class="nome" title="' + esc(chi) + '">' + esc(titolo(chi)) + '</div>' +
      '<div class="meta">' + esc(titolo(provNome(i.prov)) || "\u2014") + ' \u00b7 ' + cosa +
      (coda ? ' \u00b7 ' + esc(coda) : '') + '</div></span>' +
      '<span class="pillola ' + (CLASSI[st] || "") + '">' + esc(ETICHETTE[st] || st) + '</span>' +
      azioni + '</div>';
  }

  /* R25 — il funnel. Il tasso di risposta dice se il messaggio funziona;
     solo il funnel dice se il canale e' redditizio. */
  function funnel(righe){
    var n = FUNNEL.map(function(f){
      return f[1] === null ? righe.length
        : righe.filter(function(i){ return dataDi(i, f[1]); }).length;
    });
    var partiti = n[1] || 0;
    if(!partiti) return "";

    var perse = righe.filter(function(i){ return dataDi(i,"persa"); }).length;
    var offerto = 0, vinto = 0;
    righe.forEach(function(i){
      if(dataDi(i,"offerta")) offerto += (i.valore_offerta || 0);
      if(dataDi(i,"vendita")) vinto   += (i.valore_vendita || 0);
    });

    var passi = FUNNEL.map(function(f, k){
      var v = n[k];
      // Due percentuali: sul totale (dove sono finiti) e sullo stadio prima
      // (dove si perde). La seconda e' quella che indica il buco.
      var prec = k ? n[k-1] : 0;
      // Solo la cifra: "% del precedente" non ci stava e veniva troncato. Il
      // significato sta nel tooltip.
      var sotto = k && prec ? Math.round(v/prec*100)+"%" : "";
      return '<div class="passo'+(v?"":" zero")+'"'+
        (sotto ? ' title="'+sotto+' di '+esc(FUNNEL[k-1][0])+' ('+prec+')"' : '')+'>'+
        '<span class="q">'+v+'</span>'+
        '<span class="e">'+esc(f[0])+'</span>'+
        '<span class="p">'+esc(sotto)+'</span>'+
        '<span class="b"><i style="width:'+(n[0]?Math.round(v/n[0]*100):0)+'%"></i></span>'+
      '</div>';
    }).join('<span class="freccia">\u203a</span>');

    var coda;
    if(vinto){
      coda = '<b>'+eur(vinto)+' vinti</b> su '+partiti+' PEC partite \u2014 '+
             eur(vinto/partiti)+' di valore medio per invio.';
    } else if(offerto){
      coda = '<b>'+eur(offerto)+' offerti</b>, ancora nessuna vendita chiusa.';
    } else {
      coda = verdettoTesto(righe);
    }
    if(perse){
      var quali = {};
      righe.forEach(function(i){
        if(dataDi(i,"persa")){
          var m = i.motivo || "non registrato";
          quali[m] = (quali[m]||0)+1;
        }
      });
      var eti = {};
      MOTIVI.forEach(function(m){ eti[m[0]] = m[1]; });
      var lista = Object.keys(quali).sort(function(a,b){ return quali[b]-quali[a]; })
        .map(function(k){ return (eti[k]||k)+" ×"+quali[k]; }).join(", ");
      coda += ' Perse: '+perse+' ('+esc(lista)+').';
    }

    return '<div class="funnel"><div class="passi">'+passi+'</div>'+
           '<p class="coda">'+coda+'</p></div>';
  }

  // Il tasso di risposta con la sua lettura. Si contano come risposte anche
  // quelle andate avanti (call, offerta, vendita): sono risposte anche loro.
  function verdettoTesto(righe){
    var inviate = righe.filter(partita).length;
    var risposte = righe.filter(rispose).length;
    var t = inviate ? Math.round(risposte / inviate * 100) : 0;
    var letto = inviate < 10
      ? "Troppo pochi invii per trarre conclusioni: se ne riparla dopo i primi dieci."
      : !risposte
        ? "Nessuna risposta su abbastanza invii: la PEC arriva al protocollo ma non a chi decide."
        : risposte <= 2
          ? "\u00c8 il risultato normale di un primo contatto a freddo: il canale funziona."
          : "Sopra la norma: vale la pena allargare ad altri territori.";
    return '<b>' + risposte + (risposte === 1 ? ' risposta' : ' risposte') + ' su ' +
           inviate + ' inviate</b> (' + t + '%). ' + letto;
  }

  /* -------------------------------------------------------- scadenze */

  // Le colonne su cui si puo' ordinare, e con che valore. La chiave finisce

        th("pt","Punti","text-align:center")+

        th("cat","Categoria")+th("imp","Importo","text-align:right")+
        th("forn","Fornitore uscente")+'<th>Oggetto del contratto</th>'+
      '</tr></thead><tbody id="righe-lead"></tbody></table></div></div>';

  function filtrate(){
    // I criteri si leggono da tab, non dal DOM: cosi' sopravvivono a disegna().
    var testo = tab.testo.toLowerCase();
    var urg = parseInt(tab.urg || "0", 10);
    var chiave = ORDINI[tab.ordine] || ORDINI.gg;

    return DATI.lead.filter(function(l){
      var gg = giorni(l.scad);
      if(gg == null || gg < 0) return false;
      if(tab.cat && l.cat !== tab.cat) return false;
      if(tab.prov && l.prov !== tab.prov) return false;
      if(urg && gg > urg) return false;
      if(testo){
        var blob = (l.ente+" "+(l.ogg||"")+" "+(l.forn||"")+" "+(l.cat||"")).toLowerCase();
        if(blob.indexOf(testo) === -1) return false;
      }
      return true;
    }).sort(function(a,b){
      var x = chiave(a), y = chiave(b);
      if(x === y) return 0;
      return (x < y ? -1 : 1) * tab.verso;
    });
  }

  function disegnaRighe(){
    var righe = filtrate();
    var tot = DATI.lead.length;
    document.getElementById("conta-lead").textContent =
      righe.length === tot ? tot + " righe"
                           : righe.length + " di " + tot + " righe";

    // La freccia va solo sulla colonna attiva.
    Array.prototype.forEach.call(document.querySelectorAll("th.ord"), function(th){
      if(th.getAttribute("data-ord") === tab.ordine){
        th.setAttribute("data-dir", tab.verso === 1 ? "asc" : "desc");
      } else {
        th.removeAttribute("data-dir");
      }
    });

    var tb = document.getElementById("righe-lead");
    if(!righe.length){
      tb.innerHTML = '<tr><td colspan="8" class="vuoto">Nessun contratto con '+
        'questi filtri. <b>Azzera filtri</b> per rivederli tutti.</td></tr>';
      return;
    }
    tb.innerHTML = righe.map(function(l){
      var gg = giorni(l.scad);
      var cl = gg <= 30 ? "g-alta" : gg <= 90 ? "g-media" : "g-bassa";
      var quanto = gg === 0 ? "oggi" : gg === 1 ? "1 giorno"
                 : gg < 60 ? gg + " giorni"
                 : Math.round(gg/30) + " mesi";
      var pt = l.pt == null ? null : l.pt;
      var clp = pt == null ? "p-vuoto" : pt >= 60 ? "p-alto"
              : pt >= 35 ? "p-buono" : pt >= 18 ? "p-medio" : "p-basso";
      var spiega = pt == null ? "non ancora valutato"
                 : "probabilita di porta aperta " + (l.pr*100).toFixed(1) + "%";
      return '<tr>'+
        '<td class="pt"><span class="pallino '+clp+'" title="'+esc(spiega)+'">'+
          (pt == null ? "–" : pt)+'</span></td>'+
        '<td class="gg '+cl+'">'+quanto+
          '<span class="quando">'+dataIt(l.scad)+'</span></td>'+
        '<td class="ente">'+
          (l.cf && LOCALE ? '<button class="link-ente" data-ente="'+esc(l.cf)+'">'+esc(l.ente)+'</button>'
                : esc(l.ente))+
          '<br><a href="mailto:'+esc(l.pec)+'" class="mono" style="font-size:11px">'+esc(l.pec)+'</a></td>'+
        '<td>'+esc(titolo(provNome(l.prov))||"—")+'</td>'+
        '<td><span class="tag">'+esc(l.cat||"non classificato")+'</span></td>'+
        '<td class="imp">'+num(l.imp)+'</td>'+
        '<td>'+esc((l.forn||"—").slice(0,34))+'</td>'+
        '<td class="ogg">'+esc((l.ogg||"").slice(0,90))+'</td>'+
      '</tr>';
    }).join("");
  }

  /* ------------------------------------------------------ salvataggio */
  function pagina(nuovo){

    var ct = "<" + "/script>";

      '<meta name="viewport" content="width=device-width,initial-scale=1">\n'+

      '<link rel="preconnect" href="https://fonts.googleapis.com">\n'+
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'+
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">\n'+
      '<style id="css">'+css+'</style>\n</head>\n<body>\n<div id="app"></div>\n'+
      '<script id="dati" type="application/json">'+dati+ct+'\n'+
      '<script id="stato" type="application/json">'+JSON.stringify(nuovo)+ct+'\n'+
      '<script id="codice">'+codice+ct+'\n</body>\n</html>';

  var inCorso = false;
  function salva(chiave, voce, extra){
    if(LOCALE){
      // In locale lo stato va dritto in radar.invio: console e invii.py
      // leggono e scrivono la stessa riga, quindi non si disallineano.
      var pezzi = String(chiave).split("#");
      fetch("/api/invio", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({lotto: pezzi[0], n: parseInt(pezzi[1], 10),
                              stato: voce.stato, data: voce[voce.stato],
                              motivo: (extra||{}).motivo,
                              valore: (extra||{}).valore})
      }).catch(function(){});
      return;
    }
    if(!artefatto || inCorso) return;
    inCorso = true;
    STATO.salvato = new Date().toISOString().slice(0,16).replace("T"," ");
    artefatto.publish(pagina(STATO)).catch(function(){ /* conflitto: la vista ricarica */ })
      .finally(function(){ inCorso = false; });
  }

  /* ------------------------------------------------------------ avvio */
  // Quanto sono vecchi i dati. In locale sono sempre di adesso; nell'artifact
  // pubblicato sono una fotografia, e il pallino era verde comunque — sembrava
  // un indicatore di freschezza senza esserlo.
  function spia(){
    var eta = -(giorni(DATI.generato.slice(0,10)) || 0);
    var classe = eta > 21 ? " scaduta" : eta > 7 ? " vecchia" : "";
    // Nella copia condivisa si dice subito che e' da consultare: i bottoni
    // non ci sono, e chi la apre deve sapere perche'.
    var testo = LOCALE
      ? "in diretta dal database &middot; letti " + esc(dataOraIt(DATI.generato))
      : "sola consultazione &middot; dati del " + esc(dataOraIt(DATI.generato)) +
        (eta > 1 ? " (" + eta + " giorni fa)" : "") +
        (eta > 2 ? " &mdash; l\u2019aggiornamento del mattino non \u00e8 partito"
                 : " &middot; si aggiorna ogni mattina");
    return '<div class="spia'+classe+'"><span class="pallino"></span>'+testo+
      (STATO.salvato ? ' &middot; stato salvato ' + esc(STATO.salvato) : '')+'</div>';
  }

  function disegna(){
    app.innerHTML =
      '<div class="wrap">'+
      '<header><div><h1>Radar Appalti</h1>'+
      '<div class="sotto">Contratti informatici della PA in scadenza, e le PEC per '+
      'farsi conoscere <b>prima</b> che vengano rinnovati.</div></div>'+
      spia()+'</header>'+
      daFare()+
      '<div class="griglia"><div>'+lotti()+tabella()+'</div>'+
      '<div>'+categorie()+territorio()+competitor()+'</div></div>'+
      '<h2 class="sez">Il mercato in numeri</h2>'+tessere()+
      '<footer>Fonti: ANAC open data (CC BY-SA 4.0) e IndicePA (CC BY 4.0). '+
      'Elaborazione FlowLine, uso interno &mdash; i dati non vanno ridistribuiti a terzi.<br>'+
      'I giorni alla scadenza si ricalcolano a ogni apertura; il resto &egrave; '+
      (LOCALE ? 'letto dal database a ogni caricamento.'
              : 'la fotografia del ' + esc(dataIt(DATI.generato)) + '.')+
      '</footer></div>';

    disegnaRighe();

    // I filtri scrivono in tab prima di ridisegnare: e' quello che li fa
    // sopravvivere ai re-render innescati dagli altri pannelli.
    var campi = {"f-testo":"testo", "f-cat":"cat", "f-prov":"prov", "f-urg":"urg"};
    Object.keys(campi).forEach(function(id){
      var el = document.getElementById(id);
      if(!el) return;
      el.addEventListener(id === "f-testo" ? "input" : "change", function(){
        tab[campi[id]] = el.value;
        disegnaRighe();
      });
    });

    var az = document.getElementById("b-azzera");
    if(az) az.addEventListener("click", function(){
      tab.testo = tab.cat = tab.prov = tab.urg = "";
      disegna();
    });

    // Ordinamento: stessa colonna due volte inverte il verso.
    Array.prototype.forEach.call(document.querySelectorAll("th.ord"), function(th){
      function ordina(){
        var k = th.getAttribute("data-ord");
        if(tab.ordine === k) tab.verso = -tab.verso;
        else { tab.ordine = k; tab.verso = 1; }
        disegnaRighe();
      }
      th.addEventListener("click", ordina);
      th.addEventListener("keydown", function(e){
        if(e.key === "Enter" || e.key === " "){ e.preventDefault(); ordina(); }
      });
    });

    // Quali lotti sono aperti lo ricorda la vista: dopo un clic su una riga la
    // pagina si ridisegna, e il lotto su cui si lavora deve restare aperto.
    Array.prototype.forEach.call(app.querySelectorAll("details.lotto"), function(d){
      d.addEventListener("toggle", function(){ aperti[d.getAttribute("data-lotto")] = d.open; });
    });
    var ft = document.getElementById("f-terr");
    if(ft) ft.addEventListener("change", function(){ filtroProv = ft.value; disegna(); });
    var bc = document.getElementById("b-csv");
    if(bc && (LOCALE || scaricatore)){
      bc.hidden = false;
      bc.addEventListener("click", esporta);
    }
  }

  /* ------------------------------------------------------ esportazione */
  function csv(righe){
    var col = ["cig","ente","provincia","categoria","scadenza","giorni",
               "importo_eur","fornitore_uscente","pec","oggetto"];
    function cella(v){
      v = String(v==null ? "" : v);
      return /[";\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
    }
    var out = [col.join(";")];
    righe.forEach(function(l){
      out.push([l.cig, l.ente, l.prov, l.cat, l.scad, giorni(l.scad),
                Math.round(l.imp||0), l.forn, l.pec, l.ogg].map(cella).join(";"));
    });
    // BOM: senza, Excel apre il file in ANSI e sbaglia gli accenti
    return "﻿" + out.join("\r\n");
  }

  function esporta(){
    var righe = filtrate();
    if(!righe.length) return;
    var b = document.getElementById("b-csv");
    var testo = b.textContent;
    var nome = "scadenze-" + new Date().toISOString().slice(0,10) + ".csv";
    var contenuto = csv(righe);

    function fine(msg){
      b.textContent = msg;
      setTimeout(function(){ b.textContent = testo; b.disabled = false; }, 2600);
    }
    b.disabled = true;

    if(LOCALE){
      // Pagina servita da localhost: il download del browser funziona e basta.
      // La capability downloads serve solo dentro l'artifact pubblicato, dove
      // i link con attributo download sono inerti.
      var url = URL.createObjectURL(new Blob([contenuto], {type:"text/csv;charset=utf-8"}));
      var a = document.createElement("a");
      a.href = url; a.download = nome;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      fine("Esportate " + righe.length);
      return;
    }

    if(!scaricatore){ fine("Esportazione non disponibile"); return; }
    scaricatore.save({filename: nome, data: contenuto})
      .then(function(){ fine("Esportate " + righe.length); })
      .catch(function(){ fine("Esportazione annullata"); });
  }

  /* ------------------------------------------ invio PEC (solo in locale) */
  // Due passaggi di proposito: prima si legge cosa parte, poi si conferma.
  // Una PEC ha valore legale e non si ritira, e il destinatario sbagliato e'
  // l'unico errore qui che non si puo' correggere dopo.
  var modale = null;

  function escChiude(e){ if(e.key === "Escape") chiudiModale(); }

  function chiudiModale(){
    if(modale){ modale.remove(); modale = null; }
    document.removeEventListener("keydown", escChiude);
  }

  function apiPec(k, opz){
    var p = String(k).split("#");
    return fetch("/api/pec", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({lotto: p[0], n: parseInt(p[1], 10),
                            prova: !!opz.prova, forza: !!opz.forza,
                            sollecito: !!opz.sollecito})
    }).then(function(r){ return r.json(); });
  }

  function anteprima(k, sollecito){
    var b = app.querySelector('button[data-pec="' + k + '"]');
    if(b){ b.disabled = true; b.textContent = "leggo…"; }
    apiPec(k, {prova: true, sollecito: sollecito}).then(function(d){
      disegna();
      mostraModale(k, d, sollecito);
    }).catch(function(){
      disegna();
      mostraModale(k, {errore: "Server locale non raggiungibile: "
        + "console_live.py è ancora in esecuzione?"}, sollecito);
    });
  }

  // R19 — la scheda ente. Si legge nei dieci minuti prima di una call, e la
  // prima cosa che deve dire e' se vale la pena farla.
  function schedaEnte(cf, nome){
    mostraScheda({_attesa:true, _nome:nome});
    fetch("/api/ente?cf=" + encodeURIComponent(cf))
      .then(function(r){ return r.json(); })
      .then(function(d){ mostraScheda(d); })
      .catch(function(){
        mostraScheda({_nome:nome, _errore:"La scheda si costruisce dallo storico "+
          "completo, che sta in locale: serve console_live.py in esecuzione. "+
          "In questa copia pubblicata non \u00e8 disponibile."});
      });
  }

  function mostraScheda(d){
    chiudiModale();
    var c = d.contatti || {};
    var nome = c.denominazione_ipa || d.ente || d._nome || "Ente";
    var corpo;

    if(d._attesa){
      corpo = '<div class="scheda"><p class="capo">Leggo lo storico\u2026</p></div>';
    } else if(d._errore || d.errore){
      corpo = '<div class="scheda"><div class="blocco" style="margin:16px 0">'+
              esc(d._errore || d.errore)+'</div></div>';
    } else {
      var e = d.esiti || {};
      var q = e.n ? Math.round((e.aperte||0)/e.n*100) : null;
      var cls = q === null ? "" : q >= 15 ? "sn" : q < 5 ? "no" : "";
      var verdetto = q === null
        ? "Nessun contratto di questo ente \u00e8 ancora scaduto nel periodo osservato: non sappiamo dire come si comporta."
        : q >= 15 ? "Ente che si muove: "+(e.aperte||0)+" porte aperte su "+e.n+" scadenze osservate ("+q+"%). Vale la pena insistere."
        : q < 5   ? "Chiuso: "+(e.aperte||0)+" porte aperte su "+e.n+" ("+q+"%). Rinnova quasi sempre a chi ha gi\u00e0, per quanto spenda."
                  : "Nella media nazionale ("+q+"% contro 4,7%): "+(e.aperte||0)+" porte aperte su "+e.n+".";

      var proc = d.procedure || [], tot = 0, diretti = 0;
      proc.forEach(function(p){
        tot += p.n;
        if((p.tipo||"").toUpperCase().indexOf("AFFIDAMENTO DIRETTO") >= 0) diretti += p.n;
      });
      var qd = tot ? Math.round(diretti/tot*100) : 0;

      var anni = d.per_anno || [];
      var mx = 1;
      anni.forEach(function(a){ if((a.importo||0) > mx) mx = a.importo; });
      var mesi = (d.durata && d.durata.giorni) ? Math.round(d.durata.giorni/30.4) : null;

      corpo = '<div class="scheda">'+
        '<p class="capo">'+
          [c.tipologia_amm, c.comune || d.prov, c.regione].filter(Boolean).map(esc).join(" &middot; ")+
          (c.pec ? '<br><a href="mailto:'+esc(c.pec)+'" class="mono">'+esc(c.pec)+'</a>' : '')+
          '<br><span class="mono">'+esc(d.cf||"")+'</span> &middot; '+
          d.lotti+' lotti IT dal '+esc(String(d.primo||"?").slice(0,7))+
        '</p>'+

        '<h4>Si entra?</h4>'+
        '<div class="verdetto-ente '+cls+'">'+esc(verdetto)+'</div>'+

        '<h4>Come comprano</h4>'+
        '<div class="verdetto-ente">'+qd+'% per affidamento diretto'+
          (qd > 70 ? ' \u2014 qui non serve vincere una gara, serve essere conosciuti prima.' : '.')+
        '</div>'+

        (mesi ? '<h4>Ogni quanto</h4><div class="verdetto-ente">Durata media dei contratti: <b>'+
                mesi+' mesi</b>. Se oggi non c\u2019\u00e8 finestra, si ripassa fra circa '+
                Math.max(3, Math.round(mesi/2))+' mesi.</div>' : '')+

        (anni.length ? '<h4>Quanto spendono</h4>'+anni.map(function(a){
            return '<div class="anno"><span class="a">'+esc(a.anno)+'</span>'+
              '<span class="b"><i style="width:'+Math.round((a.importo||0)/mx*100)+'%"></i></span>'+
              '<span class="v">'+num(a.importo||0)+'</span></div>';
          }).join("") : '')+

        '<h4>Chi glieli tiene</h4><table><tbody>'+
        (d.fornitori||[]).slice(0,8).map(function(f){
          return '<tr><td class="imp">'+num(f.valore||0)+'</td><td>'+f.contratti+'</td>'+
                 '<td>'+esc(String(f.nome||"?").slice(0,42))+'</td>'+
                 '<td class="mono">'+esc(String(f.ultimo||"").slice(0,7))+'</td></tr>';
        }).join("")+'</tbody></table>'+

        '<h4>Cosa scade</h4><table><tbody>'+
        ((d.scadenze||[]).length
          ? (d.scadenze||[]).slice(0,10).map(function(s){
              var pt = s.punteggio;
              var cl = pt == null ? "p-vuoto" : pt >= 60 ? "p-alto"
                     : pt >= 35 ? "p-buono" : pt >= 18 ? "p-medio" : "p-basso";
              return '<tr><td><span class="pallino '+cl+'">'+(pt==null?"\u2013":pt)+'</span></td>'+
                '<td class="mono">'+esc(String(s.scad||""))+'</td>'+
                '<td class="imp">'+num(s.importo||0)+'</td>'+
                '<td>'+esc(String(s.oggetto_lotto||"").slice(0,54))+
                '<br><span style="color:var(--ink-3)">uscente: '+
                esc(String(s.fornitore_uscente||"?").slice(0,38))+'</span></td></tr>';
            }).join("")
          : '<tr><td colspan="4" class="vuoto">Niente in scadenza fra quelli che vediamo.</td></tr>')+
        '</tbody></table>'+

        '<h4>Cosa gli abbiamo gi\u00e0 detto</h4>'+
        (d.invii === null
          ? '<div class="verdetto-ente">Storico contatti non leggibile: '+esc(d.invii_errore||"")+'</div>'
          : (d.invii||[]).length
            ? '<table><tbody>'+d.invii.map(function(i){
                return '<tr><td class="mono">'+esc(i.lotto+"#"+i.n)+'</td>'+
                  '<td>'+esc(i.stato||"")+'</td><td class="mono">'+esc(i.inviata||"")+'</td>'+
                  '<td>'+esc(String(i.note||"").slice(0,44))+'</td></tr>';
              }).join("")+'</tbody></table>'
            : '<div class="verdetto-ente">Mai contattato.</div>')+
        '</div>';
    }

    var v = document.createElement("div");
    v.className = "velo";
    v.innerHTML = '<div class="modale" role="dialog" aria-modal="true" aria-label="Scheda ente">'+
      '<h3>'+esc(nome)+'</h3>'+corpo+
      '<div class="piede"><span class="avvertenza">Storico ANAC dal 2021. '+
      'I punti sono il punteggio del lead.</span>'+
      '<button class="btn" id="b-chiudi-scheda">Chiudi</button></div></div>';
    v.addEventListener("click", function(ev){ if(ev.target === v) chiudiModale(); });
    document.body.appendChild(v);
    modale = v;
    document.addEventListener("keydown", escChiude);
    var b = document.getElementById("b-chiudi-scheda");
    if(b){ b.addEventListener("click", chiudiModale); b.focus(); }
  }

  function mostraModale(k, d, sollecito){
    chiudiModale();
    var bloccata = !!(d.errore || (d.problemi && d.problemi.length));
    var v = document.createElement("div");
    v.className = "velo";
    v.innerHTML =
      '<div class="modale" role="dialog" aria-modal="true" aria-label="Conferma invio PEC">'+
        '<h3>' + (sollecito ? "Sollecito" : "Invio") + ' PEC' +
        (d.ente ? ' &middot; ' + esc(d.ente) : '') + '</h3>'+
        (d.errore
          ? '<div class="blocco" style="margin:14px 18px">' + esc(d.errore) + '</div>'
          : '<div class="campi">'+
              '<div><b>A</b><span class="val">' + esc(d.dest) + '</span></div>'+
              '<div><b>Oggetto</b><span class="val">' + esc(d.oggetto) + '</span></div>'+
            '</div>'+
            (d.problemi && d.problemi.length
              ? '<div class="blocco" style="margin-top:12px"><b>Non parte:</b><ul>'+
                d.problemi.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join("")+
                '</ul></div>'
              : '')+
            '<pre>' + esc(d.corpo || "") + '</pre>')+
        '<div class="piede">'+
          '<span class="avvertenza">'+
            (bloccata
              ? 'Risolvi quanto sopra, poi riprova.'
              : 'Una PEC ha valore legale e non si ritira: ricontrolla il destinatario.')+
          '</span>'+
          (bloccata ? '' : '<button class="btn btn-pec" id="m-conferma">Conferma invio</button>')+
          '<button class="btn" id="m-annulla">' + (bloccata ? 'Chiudi' : 'Annulla') + '</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(v);
    modale = v;
    v.addEventListener("click", function(e){ if(e.target === v) chiudiModale(); });
    document.addEventListener("keydown", escChiude);
    v.querySelector("#m-annulla").addEventListener("click", chiudiModale);

    var c = v.querySelector("#m-conferma");
    if(c){
      c.addEventListener("click", function(){
        c.disabled = true;
        c.textContent = "invio in corso…";
        apiPec(k, {sollecito: sollecito}).then(function(r){ esitoInvio(k, r, sollecito); }).catch(function(){
          // Timeout dopo il POST: non si sa se la PEC e' partita. Non si
          // segna nulla e si manda a guardare le ricevute, perche' un
          // reinvio alla cieca crea il doppione.
          esitoInvio(k, {errore: "Il server non ha risposto in tempo. "
            + "Controlla la finestra di console_live.py e le ricevute nella "
            + "tua casella PEC prima di riprovare: il messaggio potrebbe "
            + "essere partito."}, sollecito);
        });
      });
      c.focus();
    }
  }

  function esitoInvio(k, r, sollecito){
    if(r.errore || (r.problemi && r.problemi.length)){
      mostraModale(k, r, sollecito);
      return;
    }
    // Il server ha gia' scritto in radar.invio e svuotato la sua cache:
    // questo e' solo l'aggiornamento immediato della vista. Un sollecito non
    // e' un invio nuovo — lo stato resta 'inviata' — ma segna sollecitata,
    // che e' quello che spegne di nuovo il bottone "Sollecita".
    var voce = STATO.invii[k] || {};
    if(sollecito){
      voce.sollecitata = new Date().toISOString().slice(0, 10);
    } else {
      voce.stato = "inviata";
      voce.inviata = new Date().toISOString().slice(0, 10);
    }
    STATO.invii[k] = voce;
    chiudiModale();
    disegna();
  }

  // Un solo punto per cambiare stato, dal bottone della riga o dal menu Altro.
  // Offerta e Vendita chiedono l'importo: senza, "3 vendite" non dice se il
  // canale ripaga il lavoro. Persa chiede il motivo, da una lista chiusa.
  function applica(k, az){
    var extra = {};
    if(az === "offerta" || az === "vendita"){
      var r = prompt("Importo " + (az === "vendita" ? "della vendita" : "dell\u2019offerta") +
                     ", in euro (vuoto = non lo registro):", "");
      if(r === null) return;
      r = r.replace(/[^0-9,.]/g, "").replace(/\./g, "").replace(",", ".");
      if(r) extra.valore = parseFloat(r);
    }
    if(az === "persa"){
      var testo = MOTIVI.map(function(m, k2){ return (k2+1)+") "+m[1]; }).join("\n");
      var scelta = prompt("Perch\u00e9 si \u00e8 persa?\n\n"+testo+"\n\nNumero:", "");
      if(scelta === null) return;
      var idx = parseInt(scelta, 10) - 1;
      if(!(idx >= 0 && idx < MOTIVI.length)) return;
      extra.motivo = MOTIVI[idx][0];
    }
    var voce = STATO.invii[k] || {};
    voce.stato = az;
    voce[az] = new Date().toISOString().slice(0,10);
    if(extra.motivo) voce.motivo = extra.motivo;
    if(extra.valore != null){
      voce[az === "vendita" ? "valore_vendita" : "valore_offerta"] = extra.valore;
    }
    STATO.invii[k] = voce;
    disegna();
    salva(k, voce, extra);
  }

  app.addEventListener("change", function(e){
    var s = e.target.closest("select.altro");
    if(!s || !s.value) return;
    var az = s.value;
    s.value = "";
    applica(s.getAttribute("data-k"), az);
  });

  app.addEventListener("click", function(e){
    var se = e.target.closest("button[data-ente]");
    if(se){ schedaEnte(se.getAttribute("data-ente"), se.textContent); return; }
    var p = e.target.closest("button[data-pec]");
    if(p && !p.disabled){ anteprima(p.getAttribute("data-pec"), p.hasAttribute("data-sollecito")); return; }
    var b = e.target.closest("button[data-az]");
    if(b && !b.disabled) applica(b.getAttribute("data-k"), b.getAttribute("data-az"));
  });

  if(LOCALE){
    // Servita da console_live.py: i dati arrivano dal database, sempre freschi.
    app.innerHTML = '<div class="wrap"><p class="sotto">Carico i dati dal database…</p></div>';
    fetch("/api/dati").then(function(r){ return r.json(); }).then(function(d){
      DATI = d;
      disegna();
    }).catch(function(){
      app.innerHTML = '<div class="wrap"><div class="avviso">Database non raggiungibile. '+
        'Controlla che <b>console_live.py</b> sia in esecuzione e che '+
        '<b>ingestion/.env.local</b> contenga la stringa di connessione.</div></div>';
    });
  } else {
    disegna();
  }

  // Le capability arrivano dopo il primo render, mai durante: la pagina deve
  // funzionare senza, e accendere le funzioni quando la promessa si risolve.
  if(window.claude && window.claude.use){
    window.claude.use("artifact").then(function(a){ artefatto = a; }).catch(function(){});
    window.claude.use("downloads").then(function(d){
      scaricatore = d;
      var b = document.getElementById("b-csv");
      if(d && b){ b.hidden = false; b.addEventListener("click", esporta); }
    }).catch(function(){});
  }
})();
</script>
